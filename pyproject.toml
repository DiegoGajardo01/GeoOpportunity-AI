[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geoopportunity-ai"
version = "0.1.0"
description = "Separate territorial analysis and commercial sales ML foundations"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "geopandas>=1.0,<2",
  "duckdb>=1.1,<2",
  "pyarrow>=17,<24",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn>=0.30,<1",
  "streamlit>=1.39,<2",
  "pydeck>=0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
